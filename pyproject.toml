[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'exam-prep-ai'
version = '1.0.0'
requires-python = '>=3.12'
dependencies = [
    'fastapi[standard]>=0.115',
    'uvicorn[standard]>=0.30',
    'python-multipart>=0.0.9',
    'sqlalchemy[asyncio]>=2.0',
    'asyncpg>=0.29',
    'alembic>=1.13',
    'pgvector>=0.3',
    'pydantic>=2.8',
    'pydantic-settings>=2.4',
    'email-validator>=2.2',
    'python-jose[cryptography]>=3.3',
    'httpx>=0.27',
    'redis>=5.0',
    'celery>=5.4',
    'flower>=2.0',
    'openai>=1.40',
    'tiktoken>=0.7',
    'langchain-text-splitters>=0.2',
    'pdfplumber>=0.11',
    'pypdf>=4.3',
    'pillow>=10.4',
    'supabase>=2.6',
    'boto3>=1.35',
    'structlog>=24.4',
    'sentry-sdk[fastapi]>=2.13',
    'opentelemetry-sdk>=1.26',
    'opentelemetry-exporter-otlp>=1.26',
    'prometheus-client>=0.20',
    'slowapi>=0.1.9',
    'pytesseract>=0.3',
    'pdf2image>=1.17',
    'requests>=2.32',
    'python-magic>=0.4.27',
]

[dependency-groups]
dev = [
    'pytest>=8.3',
    'pytest-asyncio>=0.24',
    'pytest-cov>=5.0',
    'httpx>=0.27',
    'factory-boy>=3.3',
    'faker>=28.0',
    'ruff>=0.6',
    'mypy>=1.11',
    'pre-commit>=3.8',
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
